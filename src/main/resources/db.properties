# ===== Configuração do banco de dados =====
# Padrão: H2 em modo arquivo (os dados ficam gravados em disco, nada para instalar).
# O arquivo é criado em <pasta do usuário>/loja-web-db.mv.db
db.driver=org.h2.Driver
db.url=jdbc:h2:file:${user.home}/loja-web-db;MODE=PostgreSQL
db.user=sa
db.password=

